<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Warm ivory luxury background with sharp 0px corners -->
  <rect width="64" height="64" fill="#faf9f7" />
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#1a1c1b" stroke-width="1.5" />
  
  <!-- Architectural Monogram 'B' in luxury serif -->
  <text 
    x="32" 
    y="44" 
    font-family="'Libre Caslon Text', 'Georgia', serif" 
    font-size="34" 
    font-weight="400" 
    fill="#1a1c1b" 
    text-anchor="middle"
    letter-spacing="0.05em"
  >B</text>
  
  <!-- Delicate artisan accent dot in warm taupe -->
  <circle cx="46" cy="42" r="2" fill="#675d50" />
</svg>
